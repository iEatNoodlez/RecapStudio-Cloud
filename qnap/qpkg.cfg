# Recap Studio Server's QNAP package, for QNAP's QDK (qbuild). build-qpkg.sh fills in the version and the edition's
# name, and puts the server AppImage (which brings its own glibc) in x86_64/.
QPKG_NAME="RecapStudio"
QPKG_DISPLAY_NAME="Recap Studio Server"
QPKG_VER="0.0.0"
QPKG_AUTHOR="iEatNoodlez"
QPKG_LICENSE="MIT"
QPKG_SUMMARY="Turns comic chapters into narrated recap videos, used from your browser."

# App Center starts and stops it with this, and opens its page at this port (RecapStudio.sh keeps the port up to
# date when Settings → Server changes it)
QPKG_SERVICE_PROGRAM="RecapStudio.sh"
QPKG_RC_NUM="200"
QPKG_WEBUI="/"
QPKG_WEB_PORT="8780"
# (starting returns at once; stopping waits for the app to close)
QPKG_TIMEOUT="60,60"

# QTS 5 and later, on an Intel or AMD NAS (x86_64 only)
QTS_MINI_VERSION="5.0.0"
# Installs on the volume chosen, and can be moved to another one
QPKG_VOLUME_SELECT="3"

QDK_DATA_DIR_ICONS="icons"
QDK_DATA_DIR_SHARED="shared"
QDK_DATA_DIR_X86_64="x86_64"
QDK_DATA_DIR_ARM_64="arm_64"
